name: Deploy pages

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

# Don't let two deploys race each other; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Install slidev
        run:  npm add -g @slidev/cli @slidev/theme-default @slidev/theme-seriph

      - name: Build
        run: npm run build -- --base /ros-training/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # The github-pages artifact can take a few seconds (occasionally ~45s)
      # to become visible after upload, and deploy-pages looks it up once with
      # no retry, failing with 'No artifacts named "github-pages" were found'.
      # https://github.com/actions/deploy-pages/issues/451
      # A failed lookup creates no deployment, so retrying in-job is safe and
      # avoids re-running the job (which then fails with "Multiple artifacts").
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before final deploy retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 60

      - name: Deploy (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5
